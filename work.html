<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作任务台 - 个人工作页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- 顶部导航栏 -->
    <nav class="w-full max-w-2xl flex justify-center space-x-4 mb-6 bg-slate-800/60 p-3 rounded-xl border border-slate-700">
        <a href=" " class="px-4 py-2 hover:bg-slate-700 rounded-lg text-slate-300 text-sm transition">⚔️ 阵营投票</a >
        <a href="ai.html" class="px-4 py-2 hover:bg-slate-700 rounded-lg text-slate-300 text-sm transition">🤖 AI 问答</a >
        <a href="work.html" class="px-4 py-2 bg-amber-600 rounded-lg font-bold text-white text-sm">💼 工作台</a >
    </nav>

    <div class="max-w-2xl w-full bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl">
        <h1 class="text-xl font-bold text-amber-500 mb-4 text-center">💼 个人工作待办 & 备忘录</h1>
        
        <!-- 添加任务输入框 -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="task-input" placeholder="输入新的工作任务..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500">
            <button onclick="addTask()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2 rounded-xl font-bold transition">添加任务</button>
        </div>

        <!-- 任务列表 -->
        <div id="task-list" class="space-y-3">
            <!-- 动态填充 -->
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('work_tasks')) || [
            { text: '熟悉 GitHub 网页部署流程', done: true },
            { text: '测试魔兽阵营投票全网联机功能', done: false }
        ];

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            if (tasks.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-500 text-sm py-4">暂无待办事项，快去添加一个吧！</p >`;
                return;
            }
            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-xl border ${task.done ? 'bg-slate-900/40 border-slate-800 text-slate-500 line-through' : 'bg-slate-900 border-slate-700 text-slate-200'}`;
                div.innerHTML = `
                    <span onclick="toggleTask(${index})" class="cursor-pointer flex-1">${task.text}</span>
                    <button onclick="deleteTask(${index})" class="text-xs text-red-400 hover:text-red-300 ml-4 px-2 py-1 bg-red-950/40 rounded">删除</button>
                `;
                list.appendChild(div);
            });
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ text: text, done: false });
            input.value = '';
            renderTasks();
            saveTasks();
        }

        function toggleTask(index) {
            tasks[index].done = !tasks[index].done;
            renderTasks();
            saveTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
            saveTasks();
        }

        function saveTasks() {
            localStorage.setItem('work_tasks', JSON.stringify(tasks));
        }

        window.onload = renderTasks;
    </script>
</body>
</html>
