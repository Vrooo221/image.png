<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能问答 - 接入 Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- 顶部导航栏 -->
    <nav class="w-full max-w-2xl flex justify-center space-x-4 mb-4 bg-slate-800/60 p-3 rounded-xl border border-slate-700">
        <a href=" " class="px-4 py-2 hover:bg-slate-700 rounded-lg text-slate-300 text-sm transition">⚔️ 阵营投票</a >
        <a href="ai.html" class="px-4 py-2 bg-amber-600 rounded-lg font-bold text-white text-sm">🤖 AI 问答</a >
        <a href="work.html" class="px-4 py-2 hover:bg-slate-700 rounded-lg text-slate-300 text-sm transition">💼 工作台</a >
        <a href="kpi.html" class="px-4 py-2 hover:bg-slate-700 rounded-lg text-slate-300 text-sm transition">📊 KPI 看板</a >
    </nav>

    <div class="max-w-2xl w-full flex flex-col h-[72vh] bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-xl">
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-lg font-bold text-amber-500">🤖 Gemini 真实大模型对话</h1>
            <div class="flex gap-2 items-center">
                <input type="password" id="api-key-input" placeholder="输入 AQ. 开头的 Key" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-xs text-white w-40 focus:outline-none focus:border-amber-500">
                <button onclick="saveApiKey()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-3 py-1 rounded-lg transition">保存Key</button>
            </div>
        </div>
        
        <!-- 聊天记录展示框 -->
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
            <!-- 动态填充 -->
        </div>

        <!-- 输入区域 -->
        <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="问问 Gemini 关于股票、技术或任何问题..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-amber-500" onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2 rounded-xl text-sm font-bold transition">发送</button>
            <button onclick="clearChat()" class="bg-red-600/30 hover:bg-red-600/50 text-red-300 px-3 py-2 rounded-xl text-xs transition">清空</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_user_api_key') || '';
        if (apiKey) {
            document.getElementById('api-key-input').value = apiKey;
        }

        let messages = JSON.parse(localStorage.getItem('gemini_chat_history')) || [
            { role: 'model', text: '你好！我是 Gemini。请输入你的 AQ. 密钥并点“保存Key”，然后就可以开始对话了！' }
        ];

        function saveApiKey() {
            const inputVal = document.getElementById('api-key-input').value.trim();
            if (!inputVal) {
                alert('请输入有效的 API Key！');
                return;
            }
            apiKey = inputVal;
            localStorage.setItem('gemini_user_api_key', apiKey);
            alert('API Key 保存成功！');
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                div.innerHTML = `<div class="max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed ${msg.role === 'user' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'}">${msg.text.replace(/\n/g, '<br>')}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            if (!apiKey) {
                alert('请先在右上角输入并点击“保存Key”！');
                return;
            }

            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            messages.push({ role: 'user', text: text });
            input.value = '';
            renderChat();
            saveHistory();

            const loadingId = messages.length;
            messages.push({ role: 'model', text: 'Gemini 正在思考中...' });
            renderChat();

            try {
                // 适配最新 API 接口与 gemini-2.5 / 1.5 模型
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    messages[loadingId] = { role: 'model', text: aiReply };
                } else if (data.error) {
                    messages[loadingId] = { role: 'model', text: '调用报错：' + (data.error.message || JSON.stringify(data.error)) };
                } else {
                    messages[loadingId] = { role: 'model', text: '返回数据格式异常：' + JSON.stringify(data) };
                }
            } catch (error) {
                messages[loadingId] = { role: 'model', text: '网络请求失败，请检查网络或代理连接。' };
            }

            renderChat();
            saveHistory();
        }

        function saveHistory() {
            localStorage.setItem('gemini_chat_history', JSON.stringify(messages));
        }

        function clearChat() {
            if (confirm('确定要清空聊天记录吗？')) {
                localStorage.removeItem('gemini_chat_history');
                messages = [{ role: 'model', text: '记录已清空。' }];
                renderChat();
            }
        }

        window.onload = renderChat;
    </script>
</body>
</html>
