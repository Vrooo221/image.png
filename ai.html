<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能问答 - 接入 Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 sm:p-4">

    <!-- 顶部导航栏 -->
    <nav class="w-full max-w-5xl flex flex-wrap justify-center gap-2 mb-3 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700">
        <a href=" " class="px-3 sm:px-4 py-1.5 hover:bg-slate-700 rounded-lg text-slate-300 text-xs sm:text-sm transition">⚔️ 阵营投票</a >
        <a href="ai.html" class="px-3 sm:px-4 py-1.5 bg-amber-600 rounded-lg font-bold text-white text-xs sm:text-sm">🤖 AI 问答</a >
        <a href="work.html" class="px-3 sm:px-4 py-1.5 hover:bg-slate-700 rounded-lg text-slate-300 text-xs sm:text-sm transition">💼 工作台</a >
        <a href="kpi.html" class="px-3 sm:px-4 py-1.5 hover:bg-slate-700 rounded-lg text-slate-300 text-xs sm:text-sm transition">📊 KPI 看板</a >
    </nav>

    <!-- 聊天主面板 -->
    <div class="w-[98%] sm:w-[95%] max-w-5xl flex flex-col h-[88vh] bg-slate-800/80 border border-slate-700 rounded-2xl p-3 sm:p-5 shadow-2xl">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3 pb-2 border-b border-slate-700/60">
            <h1 class="text-base sm:text-lg font-bold text-amber-500 flex items-center gap-2">🤖 Gemini 真实大模型对话</h1>
            <div class="flex gap-2 items-center w-full sm:w-auto justify-end">
                <input type="password" id="api-key-input" placeholder="输入 AQ. 开头的 Key" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white w-40 sm:w-48 focus:outline-none focus:border-amber-500">
                <button onclick="saveApiKey()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-3.5 py-1.5 rounded-lg transition whitespace-nowrap">保存Key</button>
            </div>
        </div>
        
        <!-- 聊天记录展示框 -->
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 bg-slate-900/60 p-3 sm:p-4 rounded-xl border border-slate-800">
            <!-- 动态填充 -->
        </div>

        <!-- 输入区域 -->
        <div class="flex gap-2 sm:gap-3">
            <input type="text" id="user-input" placeholder="问问 Gemini 关于股票、技术或任何问题..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-amber-500" onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-amber-600 hover:bg-amber-500 text-white px-5 sm:px-7 py-3 rounded-xl text-base font-bold transition whitespace-nowrap">发送</button>
            <button onclick="clearChat()" class="bg-red-600/30 hover:bg-red-600/50 text-red-300 px-3 sm:px-4 py-3 rounded-xl text-sm transition whitespace-nowrap">清空记录</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_user_api_key') || '';
        if (apiKey) {
            document.getElementById('api-key-input').value = apiKey;
        }

        let messages = JSON.parse(localStorage.getItem('gemini_chat_history')) || [
            { role: 'model', text: '你好！我是 Gemini。请输入你的 AQ. 密钥并点“保存Key”，然后就可以开始对话了！' }
        ];

        function saveApiKey() {
            const inputVal = document.getElementById('api-key-input').value.trim();
            if (!inputVal) {
                alert('请输入有效的 API Key！');
                return;
            }
            apiKey = inputVal;
            localStorage.setItem('gemini_user_api_key', apiKey);
            alert('API Key 保存成功！');
        }

        function speakText(index) {
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音朗读功能！');
                return;
            }
            // 停止当前正在播放的朗读
            window.speechSynthesis.cancel();

            const textToSpeak = messages[index].text;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'zh-CN'; // 设置中文朗读
            utterance.rate = 1.0;     // 语速
            window.speechSynthesis.speak(utterance);
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            messages.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                let innerContent = `<div class="max-w-[90%] sm:max-w-[85%] p-4 rounded-2xl text-base leading-relaxed ${msg.role === 'user' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-100 border border-slate-700'}">`;
                innerContent += msg.text.replace(/\n/g, '<br>');
                
                // 如果是 AI 回复且不是思考中的提示词，就加上“朗读”按钮
                if (msg.role === 'model' && !msg.text.includes('Gemini 正在思考中')) {
                    innerContent += `
                        <div class="mt-2.5 pt-2 border-t border-slate-700/50 flex justify-end">
                            <button onclick="speakText(${index})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                                🔊 朗读回复
                            </button>
                        </div>
                    `;
                }
                innerContent += `</div>`;
                div.innerHTML = innerContent;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            if (!apiKey) {
                alert('请先在右上角输入并点击“保存Key”！');
                return;
            }

            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            messages.push({ role: 'user', text: text });
            input.value = '';
            renderChat();
            saveHistory();

            const loadingId = messages.length;
            messages.push({ role: 'model', text: 'Gemini 正在思考中...' });
            renderChat();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    messages[loadingId] = { role: 'model', text: aiReply };
                } else if (data.error) {
                    messages[loadingId] = { role: 'model', text: '调用报错：' + (data.error.message || JSON.stringify(data.error)) };
                } else {
                    messages[loadingId] = { role: 'model', text: '返回数据格式异常：' + JSON.stringify(data) };
                }
            } catch (error) {
                messages[loadingId] = { role: 'model', text: '网络请求失败，请检查网络或代理连接。' };
            }

            renderChat();
            saveHistory();
        }

        function saveHistory() {
            localStorage.setItem('gemini_chat_history', JSON.stringify(messages));
        }

        function clearChat() {
            if (confirm('确定要清空聊天记录吗？')) {
                window.speechSynthesis.cancel(); // 清空时停止朗读
                localStorage.removeItem('gemini_chat_history');
                messages = [{ role: 'model', text: '记录已清空。' }];
                renderChat();
            }
        }

        window.onload = renderChat;
    </script>
</body>
</html>
